[project]
name = "pacman-42"
version = "0.1.0"
description = "A Pac-Man game created for the 42 curriculum."
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "pygame-ce>=2.5.0,<3.0",
]

[dependency-groups]
dev = [
    "flake8>=7.0.0",
    "mypy>=1.10.0",
    "pytest>=8.0.0",
    "pyinstaller>=6.0.0",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
disallow_untyped_defs = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

